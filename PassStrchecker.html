<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 20px;
      text-align: center;
    }
    .container {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      outline: none;
    }
    .strength-bar {
      height: 10px;
      width: 100%;
      background-color: #444;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .strength {
      height: 100%;
      width: 0%;
      transition: 0.3s;
    }
    .weak { background-color: red; width: 33%; }
    .medium { background-color: blue; width: 66%; }
    .strong { background-color: green; width: 100%; }
    p {
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>🔐 Password Strength Checker</h1>
  <div class="container">
    <input type="password" id="password" placeholder="Type your password...">
    <div class="strength-bar">
      <div id="strength" class="strength"></div>
    </div>
    <p id="strength-text">Strength: —</p>
  </div>

  <script>
    const password = document.getElementById("password");
    const strengthBar = document.getElementById("strength");
    const strengthText = document.getElementById("strength-text");

    password.addEventListener("input", () => {
      const value = password.value;
      let strength = 0;

      if (value.length >= 8) strength++;
      if (/[A-Z]/.test(value)) strength++;
      if (/[0-9]/.test(value)) strength++;
      if (/[^A-Za-z0-9]/.test(value)) strength++;

      if (strength === 0) {
        strengthBar.className = "strength";
        strengthText.textContent = "Strength: —";
      } else if (strength <= 2) {
        strengthBar.className = "strength weak";
        strengthText.textContent = "Strength: Weak ⚠️";
      } else if (strength === 3) {
        strengthBar.className = "strength medium";
        strengthText.textContent = "Strength: Medium 💪";
      } else {
        strengthBar.className = "strength strong";
        strengthText.textContent = "Strength: Strong 🔥";
      }
    });
  </script>

</body>
</html>
